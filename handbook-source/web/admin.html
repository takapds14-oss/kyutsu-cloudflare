<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>球通BC 管理画面</title><link rel="stylesheet" href="/handbook/style.css"></head>
<body><header><strong>KYUTSU BC / 管理画面</strong><a href="/handbook/">閲覧画面へ ↗</a></header>
<main class="editor"><h1>ハンドブックを編集</h1><p>保存するとメンバー向けの画面に反映されます。</p>
<div class="toolbar"><label>編集する項目 <select id="section" disabled></select></label>
<label id="record-label">編集する行 <select id="record" disabled></select></label>
<button id="add" type="button" class="linkbutton" disabled>新規追加</button></div>
<form id="editor-form"><fieldset id="fields" disabled></fieldset>
<div class="toolbar"><button id="save" class="primary" disabled>変更を保存</button>
<button id="remove" type="button" class="linkbutton" disabled>この行を削除</button></div></form>
<p id="status" role="status">読み込み中…</p></main>
<script src="/handbook/schema.js"></script><script src="/handbook/admin.js"></script></body></html>
